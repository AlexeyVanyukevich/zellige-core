<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Mounted at /etc/fonts/local.conf in the browser container: the image's own system-ui face
     has no weight above regular, so the kit's semibold text would render at 400. -->
<fontconfig>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>

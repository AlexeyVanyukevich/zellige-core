<!-- example: center -->
<dialog class="zl-dialog" aria-labelledby="dialog-center-title">
  <div class="zl-dialog__frame" tabindex="-1">
    <div class="zl-dialog__head">
      <h2 class="zl-dialog__title" id="dialog-center-title">New booking</h2>
      <button type="button" class="zl-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="zl-dialog__body">
      <div class="zl-field">
        <label class="zl-field__label" for="dialog-center-guest">Guest</label>
        <input class="zl-input" id="dialog-center-guest" />
      </div>
    </div>
    <div class="zl-dialog__foot">
      <button type="button" class="zl-button">Cancel</button>
      <button type="button" class="zl-button zl-button--primary">Save</button>
    </div>
  </div>
</dialog>

<!-- example: side -->
<dialog class="zl-dialog zl-dialog--side" aria-labelledby="dialog-side-title">
  <div class="zl-dialog__frame" tabindex="-1">
    <div class="zl-dialog__head">
      <h2 class="zl-dialog__title" id="dialog-side-title">Card</h2>
      <button type="button" class="zl-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="zl-dialog__body">
      <div class="zl-field">
        <label class="zl-field__label" for="dialog-side-name">Title</label>
        <input class="zl-input" id="dialog-side-name" value="Fix the login redirect" />
      </div>
      <div class="zl-field">
        <label class="zl-field__label" for="dialog-side-status">Status</label>
        <select class="zl-select" id="dialog-side-status">
          <option>Open</option>
          <option>In progress</option>
          <option>Done</option>
        </select>
      </div>
      <div class="zl-field">
        <label class="zl-field__label" for="dialog-side-notes">Notes</label>
        <textarea class="zl-textarea" id="dialog-side-notes"></textarea>
      </div>
    </div>
    <div class="zl-dialog__foot">
      <button type="button" class="zl-button">Cancel</button>
      <button type="button" class="zl-button zl-button--primary">Save</button>
    </div>
  </div>
</dialog>

<!-- example: without-foot -->
<dialog class="zl-dialog" aria-labelledby="dialog-plain-title">
  <div class="zl-dialog__frame" tabindex="-1">
    <div class="zl-dialog__head">
      <h2 class="zl-dialog__title" id="dialog-plain-title">Keyboard shortcuts</h2>
      <button type="button" class="zl-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="zl-dialog__body">
      <p>Press N for a new card and slash to search.</p>
    </div>
  </div>
</dialog>

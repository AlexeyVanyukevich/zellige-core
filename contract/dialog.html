<!-- example: center -->
<dialog class="ui-dialog" aria-labelledby="dialog-center-title">
  <div class="ui-dialog__frame" tabindex="-1">
    <div class="ui-dialog__head">
      <h2 class="ui-dialog__title" id="dialog-center-title">New booking</h2>
      <button type="button" class="ui-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="ui-dialog__body">
      <div class="ui-field">
        <label class="ui-field__label" for="dialog-center-guest">Guest</label>
        <input class="ui-input" id="dialog-center-guest" />
      </div>
    </div>
    <div class="ui-dialog__foot">
      <button type="button" class="ui-button">Cancel</button>
      <button type="button" class="ui-button ui-button--primary">Save</button>
    </div>
  </div>
</dialog>

<!-- example: side -->
<dialog class="ui-dialog ui-dialog--side" aria-labelledby="dialog-side-title">
  <div class="ui-dialog__frame" tabindex="-1">
    <div class="ui-dialog__head">
      <h2 class="ui-dialog__title" id="dialog-side-title">Card</h2>
      <button type="button" class="ui-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="ui-dialog__body">
      <div class="ui-field">
        <label class="ui-field__label" for="dialog-side-name">Title</label>
        <input class="ui-input" id="dialog-side-name" value="Fix the login redirect" />
      </div>
      <div class="ui-field">
        <label class="ui-field__label" for="dialog-side-status">Status</label>
        <select class="ui-select" id="dialog-side-status">
          <option>Open</option>
          <option>In progress</option>
          <option>Done</option>
        </select>
      </div>
      <div class="ui-field">
        <label class="ui-field__label" for="dialog-side-notes">Notes</label>
        <textarea class="ui-textarea" id="dialog-side-notes"></textarea>
      </div>
    </div>
    <div class="ui-dialog__foot">
      <button type="button" class="ui-button">Cancel</button>
      <button type="button" class="ui-button ui-button--primary">Save</button>
    </div>
  </div>
</dialog>

<!-- example: without-foot -->
<dialog class="ui-dialog" aria-labelledby="dialog-plain-title">
  <div class="ui-dialog__frame" tabindex="-1">
    <div class="ui-dialog__head">
      <h2 class="ui-dialog__title" id="dialog-plain-title">Keyboard shortcuts</h2>
      <button type="button" class="ui-dialog__close" aria-label="Close">✕</button>
    </div>
    <div class="ui-dialog__body">
      <p>Press N for a new card and slash to search.</p>
    </div>
  </div>
</dialog>

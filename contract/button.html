<!-- example: neutral -->
<button type="button" class="zl-button">Cancel</button>

<!-- example: primary -->
<button type="button" class="zl-button zl-button--primary">Save</button>

<!-- example: quiet -->
<button type="button" class="zl-button zl-button--quiet">Show more</button>

<!-- example: danger -->
<button type="button" class="zl-button zl-button--danger">Delete</button>

<!-- example: disabled -->
<button type="button" class="zl-button zl-button--primary" disabled>Save</button>

<!-- example: busy -->
<button type="button" class="zl-button zl-button--primary" aria-busy="true">Save</button>

<!-- example: link -->
<a class="zl-button" href="/board">Open the board</a>

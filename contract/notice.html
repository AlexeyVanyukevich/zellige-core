<!-- example: info -->
<div class="ui-notice" role="status">
  <p class="ui-notice__title">Booking saved</p>
  <div class="ui-notice__body"><p>It is on the calendar for 12 to 14 October.</p></div>
</div>

<!-- example: danger -->
<div class="ui-notice ui-notice--danger" role="alert">
  <p class="ui-notice__title">Payment failed</p>
  <div class="ui-notice__body"><p>The card was declined. Try another card.</p></div>
</div>

<!-- example: title-only -->
<div class="ui-notice" role="status">
  <p class="ui-notice__title">All changes are saved</p>
</div>

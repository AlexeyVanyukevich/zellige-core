<!-- example: info -->
<div class="zl-notice" role="status">
  <p class="zl-notice__title">Booking saved</p>
  <div class="zl-notice__body"><p>It is on the calendar for 12 to 14 October.</p></div>
</div>

<!-- example: danger -->
<div class="zl-notice zl-notice--danger" role="alert">
  <p class="zl-notice__title">Payment failed</p>
  <div class="zl-notice__body"><p>The card was declined. Try another card.</p></div>
</div>

<!-- example: title-only -->
<div class="zl-notice" role="status">
  <p class="zl-notice__title">All changes are saved</p>
</div>
